name: Deploy Presentation to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'presentation/**'
      - '.github/workflows/deploy-presentation.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Prepare presentation folder
        run: |
          # Copy presentation.html to index.html so it serves as the home page
          cp presentation/presentation.html presentation/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './presentation'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
